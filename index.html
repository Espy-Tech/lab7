<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Галерея</title>
    <script src="jquery-3.4.1.min.js"></script>
    <script src="my.js"></script>
    <link rel="stylesheet" href="style.css">
    
  </head>
  <body>
    <header class="page-header">
      <h1>SpySkin</h1>
      <p>Популярные скины в Counter-Strike</p>
    </header>

    <main>
      <div class="gallery-container">
        <div class="gallery" aria-label="Галерея изображений">
          <div class="gallery-viewport">
            <div class="gallery-track">
              <div class="slide">
                <img src="images/ak_redline.png" alt="AK-47 | Redline" />
                <div class="slide-caption">AK-47 | Redline</div>
              </div>
              <div class="slide">
                <img src="images/AWP_Asiimov.png" alt="AWP | Asiimov" />
                <div class="slide-caption">AWP | Asiimov</div>
              </div>
              <div class="slide">
                <img src="images/M4A4_Neo-Noir.png" alt="M4A4 | Neo-Noir" />
                <div class="slide-caption">M4A4 | Neo-Noir</div>
              </div>
              <div class="slide">
                <img src="images/Desert_Eagle_Printstream.png" alt="Desert Eagle | Printstream" />
                <div class="slide-caption">Desert Eagle | Printstream</div>
              </div>
              <div class="slide">
                <img src="images/Glock-18_Fade.png" alt="Glock-18 | Fade" />
                <div class="slide-caption">Glock-18 | Fade</div>
              </div>
              <div class="slide">
                <img src="images/USP-S_Kill_Confirmed.png" alt="USP-S | Kill Confirmed" />
                <div class="slide-caption">USP-S | Kill Confirmed</div>
              </div>
              <div class="slide">
                <img src="images/AWP_Dragon_Lore.png" alt="AWP | Dragon Lore" />
                <div class="slide-caption">AWP | Dragon Lore</div>
              </div>
              <div class="slide">
                <img src="images/AK-47_Head_Shot.png" alt="AK-47 | Head Shot" />
                <div class="slide-caption">AK-47 | Head Shot</div>
              </div>
            </div>
          </div>

          <div class="gallery-controls">
            <button class="nav-btn prev" type="button" aria-label="Предыдущая страница">&#10094;</button>
            <button class="nav-btn next" type="button" aria-label="Следующая страница">&#10095;</button>
          </div>
        </div>

        <div class="pagination">
          <div class="pagination-dots" aria-label="Страницы галереи"></div>
        </div>
      </div>
    </main>

    <footer class="page-footer">SPY-SKIN-2026</footer>
  </body>
</html>
